project_id = "pboxqwrogkwxkrjvbsqo"

# Auth (GoTrue): vigencia de enlaces y códigos OTP por correo (confirmación, recovery, magic link).
# Producción: replicar en Supabase Dashboard → Authentication → Sign In / Providers → Email
# → «Email OTP expiration» = 86400 (24 h). No vive en migraciones SQL; puede resetearse al sincronizar.
[auth.email]
otp_expiry = 86400

# Google OAuth («Continuar con Google»). La app usa signInWithOAuth → /auth/callback (PKCE).
# Producción: Client ID + Secret en Supabase Dashboard → Authentication → Sign In / Providers → Google.
# Local (supabase start): exporta las vars en .env y cambia enabled a true.
# Google Cloud → OAuth consent screen: nombre «Alcéntimo», dominio alcentimo.com.
# Google Cloud → Credentials → redirect URI obligatoria:
#   https://pboxqwrogkwxkrjvbsqo.supabase.co/auth/v1/callback  (producción)
#   http://127.0.0.1:54321/auth/v1/callback                    (local CLI)
# JavaScript origins: https://alcentimo.com y http://localhost:3000
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false

# Manual / pruebas: GET/POST con ?slot=midnight|morning|retry y Bearer CRON_SECRET
[functions.sync-bcv]
verify_jwt = false

# Cron: configurar en Supabase Dashboard → Integrations → Cron, o Vercel (ver vercel.json).
[functions.sync-bcv-midnight]
verify_jwt = false

[functions.sync-bcv-morning]
verify_jwt = false

[functions.sync-bcv-retry]
verify_jwt = false

# Aprovisionamiento de subdominios de tienda (invocada desde Next.js con service role)
[functions.provision-store-subdomain]
verify_jwt = false
